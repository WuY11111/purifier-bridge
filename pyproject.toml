[project]
name = "purifier-bridge"
version = "0.3.1"
description = "Laptop temperature → Xiaomi air purifier fan speed (miIO over LAN, Windows GUI, zero dependencies)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["xiaomi", "miio", "air-purifier", "laptop-cooling", "temperature", "windows", "tkinter"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# 只强制“真错误”类规则；风格类不卡人
select = ["F", "E9"]
